{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="panel form-narrow">
    <h1 class="page-title">Регистрация</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button class="btn">Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script>
// Поле псевдонима нужно только автору
const role = document.getElementById('id_role');
const stage = document.getElementById('id_stage_name').closest('.form-row');
function toggleStage() { stage.style.display = role.value === 'author' ? '' : 'none'; }
role.addEventListener('change', toggleStage);
toggleStage();
</script>
{% endblock %}
